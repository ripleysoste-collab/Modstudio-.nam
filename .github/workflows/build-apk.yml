name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar release en GitHub (true/false)'
        required: false
        default: 'true'
        type: string
      custom_tag:
        description: 'Tag personalizado (opcional, ej. v1.0.1)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y Generar APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Android SDK Environment
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/tools" >> $GITHUB_PATH
          echo "Aceptando licencias del Android SDK..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Preparar Entorno y Keystores de Firma
        run: |
          echo "==> Configurando archivos de entorno..."
          # Configurar archivo .env
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo "Creado .env desde .env.example"
          elif [ ! -f ".env" ]; then
            echo "# Modstudio Android" > .env
          fi

          # Configurar debug.keystore si no existe
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generado debug.keystore de respaldo"
          fi

          # Configurar release keystore
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "Decodificado my-upload-key.jks desde Secret"
          elif [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Modstudio Release,O=Modstudio,C=US"
            echo "Generado release keystore my-upload-key.jks automático"
          fi

          # Permisos de ejecución para el wrapper de Gradle
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Compilar APK (Release)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          echo "==> Iniciando compilación del APK Release..."
          GRADLE_CMD="./gradlew"
          if [ ! -x "./gradlew" ]; then
            GRADLE_CMD="gradle"
          fi
          
          # Compilar APK Release (con fallback a Debug si hay algún problema de firma externa)
          $GRADLE_CMD :app:assembleRelease --no-daemon --stacktrace || $GRADLE_CMD :app:assembleDebug --no-daemon --stacktrace

      - name: Localizar y Preparar APK para Distribución
        id: prepare_apk
        run: |
          echo "==> Buscando APK generado..."
          # Buscar primero en release, luego en general
          APK_FOUND=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            APK_FOUND=$(find app/build/outputs/apk -name "*release*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_FOUND" ]; then
            APK_FOUND=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APK_FOUND" ] || [ ! -f "$APK_FOUND" ]; then
            echo "Error: No se encontró ningún archivo APK generado en app/build/outputs/apk!"
            exit 1
          fi

          echo "APK encontrado: $APK_FOUND"
          mkdir -p dist
          cp "$APK_FOUND" dist/Modstudio.apk
          
          # Generar checksum SHA-256
          cd dist
          sha256sum Modstudio.apk > Modstudio.apk.sha256
          SHA_VALUE=$(awk '{print $1}' Modstudio.apk.sha256)
          cd ..

          FILE_SIZE=$(du -h dist/Modstudio.apk | awk '{print $1}')
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          # Determinar Tag y Título de Release
          TAG_NAME="v1.0.${{ github.run_number }}"
          if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.custom_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_size=$FILE_SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$SHA_VALUE" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "release_title=Modstudio $TAG_NAME" >> "$GITHUB_OUTPUT"

          echo "==> APK preparado con éxito en dist/Modstudio.apk ($FILE_SIZE)"
          echo "==> SHA-256: $SHA_VALUE"

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        if: |
          github.event_name != 'pull_request' &&
          (
            startsWith(github.ref, 'refs/tags/') ||
            github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/master' ||
            github.event.inputs.publish_release == 'true' ||
            github.event_name == 'workflow_dispatch'
          )
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          name: ${{ steps.prepare_apk.outputs.release_title }}
          body: |
            ## 🎮 Modstudio Android APK
            
            Compilación automatizada de Modstudio para Android.
            
            ### 📋 Información del Build
            - **Versión:** `${{ steps.prepare_apk.outputs.tag_name }}`
            - **Tamaño:** `${{ steps.prepare_apk.outputs.apk_size }}`
            - **Commit:** `${{ github.sha }}`
            - **Fecha de compilación:** `${{ steps.prepare_apk.outputs.build_date }}`
            - **SHA-256:** `${{ steps.prepare_apk.outputs.apk_sha256 }}`
            
            ### 📥 Descarga e Instalación
            Descarga el archivo `Modstudio.apk` que aparece abajo en los archivos adjuntos (Assets) e instálalo directamente en tu dispositivo Android.
          files: |
            dist/Modstudio.apk
            dist/Modstudio.apk.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir APK como Artefacto del Flujo (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Modstudio-APK-${{ steps.prepare_apk.outputs.tag_name }}
          path: |
            dist/Modstudio.apk
            dist/Modstudio.apk.sha256
          if-no-files-found: error
          retention-days: 14
